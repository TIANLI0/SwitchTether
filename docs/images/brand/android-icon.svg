<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="216" height="216">
  <!-- The Android launcher icon (res/drawable/ic_launcher_*.xml) under a squircle mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C93FF"/>
      <stop offset="1" stop-color="#1446D4"/>
    </linearGradient>
    <clipPath id="mask"><rect x="9" y="9" width="90" height="90" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#mask)">
    <rect width="108" height="108" fill="url(#bg)"/>
    <path d="M38,68C38,50 70,58 70,40" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="68" r="9.5" fill="#FFFFFF"/>
    <circle cx="70" cy="40" r="11" fill="#FFFFFF"/>
  </g>
</svg>
