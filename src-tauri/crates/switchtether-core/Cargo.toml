[package]
name = "switchtether-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "SwitchTether Remote Core: authenticated remote API, pairing, terminals, files and agent adapters"
publish = false

[lib]
doctest = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
hex = "0.4"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
dirs = "5.0"
percent-encoding = "2.3"
encoding_rs = "0.8"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
axum = { version = "0.7", features = ["ws", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
tower = { version = "0.4", features = ["util"] }
http = "1"
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }

rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.9"
vt100 = "0.18"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.15"
socket2 = { version = "0.6", features = ["all"] }
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
hyper = { version = "1", features = ["client", "http1"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
