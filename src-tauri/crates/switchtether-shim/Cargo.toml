[package]
name = "switchtether-shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "Opt-in process wrapper that lets SwitchTether attach to Claude Code / Codex sessions started by the user"
publish = false

[[bin]]
name = "switchtether-shim"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
base64 = "0.22"
dirs = "5.0"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
