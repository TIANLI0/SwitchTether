name: Release

# Builds SwitchTether desktop bundles (Windows, macOS, Linux) and the Android APK for
# a version tag, then creates a DRAFT GitHub release. Nothing is published
# automatically. Signing is optional and only used when the corresponding
# secrets exist; unsigned artifacts are labelled as such.
#
# Secrets (all optional):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD  updater signatures
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID                       macOS signing + notarization
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD                        Android release signing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not create a release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            # Packaged by FluentSetup below (SwitchTether-<version>-Setup.exe, replaces CC Switch).
            args: "--no-bundle"
          - name: macos-universal
            os: macos-15
            args: "--target universal-apple-darwin --bundles app,dmg"
          - name: linux-x64
            os: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
    steps:
      - uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Prepare updater signing key
        id: updater
        if: env.HAS_UPDATER_KEY == 'true'
        uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            extra='--config {"bundle":{"createUpdaterArtifacts":true}}'
          fi
          pnpm tauri build ${{ matrix.args }} $extra

      - name: Install FluentSetup
        if: runner.os == 'Windows'
        uses: TIANLI0/FluentSetup@v1.5.0

      - name: Package Windows installer (FluentSetup)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/package-windows.mjs --skip-build

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          if [ -d target-win/dist ]; then cp target-win/dist/*-Setup.exe dist-release/; fi
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.sig' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} dist-release/ \;
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist-release/*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        working-directory: android
        env:
          ST_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          ST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Name and verify release APK
        shell: bash
        run: |
          ver="$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then ver="${GITHUB_REF_NAME#v}"; fi
          mkdir -p dist-android
          signed=android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$signed" ]; then
            certs="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$signed")"
            echo "$certs" | grep -E "certificate (DN|SHA-256 digest)"
            # The release key's certificate; installed apps only accept updates signed by it.
            echo "$certs" | grep -q "certificate SHA-256 digest: 214a252bda32cb7e65e68a82f6322e509899e8f8aa08c07e12eb25dd84e90ab6"               || { echo "::error::APK is not signed with the SwitchTether release key"; exit 1; }
            cp "$signed" "dist-android/SwitchTether-$ver-android.apk"
          else
            echo "::warning::No signing secrets: the APK is UNSIGNED and cannot update an installed app."
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist-android/SwitchTether-$ver-android-unsigned.apk"
          fi
          ls -la dist-android

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android/*

  release:
    name: Draft GitHub release
    needs: [desktop, android]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find artifacts -type f | sort
          # Checksums for the in-app updaters (Android and FluentSetup verify against this file).
          (cd artifacts && find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + \
            | sed -E 's#  \./[^/]+/#  #' > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt
          notes="SwitchTether $TAG (draft). Check signing status before publishing: unsigned artifacts are produced when signing secrets are absent."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "SwitchTether $TAG" --notes "$notes" $(find artifacts -type f)
