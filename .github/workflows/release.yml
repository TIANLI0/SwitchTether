name: Release

# Builds SwitchTether desktop bundles (Windows, macOS, Linux) and the Android APK (from
# TIANLI0/SwitchTether-Android) for a version tag, then creates a DRAFT GitHub release. Nothing is published
# automatically. Signing is optional and only used when the corresponding
# secrets exist; unsigned artifacts are labelled as such.
#
# Secrets (all optional):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD  updater signatures
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID                       macOS signing + notarization
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD                        Android release signing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.2.0). Empty: build only, from main and android_ref."
        type: string
        default: ""
      dry_run:
        description: "Build only, do not create a release"
        type: boolean
        default: true
      targets:
        description: "What to build"
        type: choice
        options: [all, android, desktop]
        default: all
      android_ref:
        description: "SwitchTether-Android ref to build when no release tag is given"
        type: string
        default: main

# The Android app lives in TIANLI0/SwitchTether-Android, but its APK is published here, next to
# the desktop bundles: users and the in-app updater read this repository's releases, and the
# release signing key is a secret of this repository only. The android job checks out
# SwitchTether-Android at the release tag.
#
# A release tag builds the platforms whose own version equals the tag's (see the plan job):
#   desktop  package.json carries the tag's version
#   android  TIANLI0/SwitchTether-Android has the same tag (its release.yml checks that the tag
#            equals versionName, then dispatches this workflow with release_tag)
# So an Android-only release is a tag in SwitchTether-Android alone; without the dispatch token
# start it by hand: gh workflow run release.yml -f release_tag=vX.Y.Z -f dry_run=false.
# A second run for the same tag adds its assets to the existing draft and merges SHA256SUMS.txt.
# The updaters cope with a release that lacks their asset (they skip it).

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

env:
  ANDROID_REPO: TIANLI0/SwitchTether-Android

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      desktop: ${{ steps.plan.outputs.desktop }}
      android: ${{ steps.plan.outputs.android }}
      android_ref: ${{ steps.plan.outputs.android_ref }}
    steps:
      - uses: actions/checkout@v6
      - name: Decide what this release builds
        id: plan
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_ANDROID_REF: ${{ inputs.android_ref }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="$INPUT_TAG"; fi
          desktop=true
          android=true
          android_ref="${INPUT_ANDROID_REF:-main}"
          if [ -n "$tag" ]; then
            case "$tag" in
              v[0-9]*) ;;
              *) echo "::error::Release tag must look like v1.2.3, got '$tag'."; exit 1 ;;
            esac
            ver="${tag#v}"
            desktop_ver="$(sed -nE 's/^ *"version": *"([^"]+)".*/\1/p' package.json | head -n 1)"
            echo "tag $tag, desktop $desktop_ver"
            [ "$desktop_ver" = "$ver" ] || desktop=false
            if git ls-remote --exit-code --tags "https://github.com/$ANDROID_REPO.git" "refs/tags/$tag" >/dev/null; then
              echo "$ANDROID_REPO has $tag"
              android_ref="$tag"
            else
              echo "$ANDROID_REPO has no tag $tag"
              android=false
            fi
            if [ "$desktop" = false ] && [ "$android" = false ]; then
              echo "::error::Tag $tag matches neither the desktop version ($desktop_ver) nor a tag of $ANDROID_REPO."
              exit 1
            fi
          fi
          case "$TARGETS" in
            android) desktop=false ;;
            desktop) android=false ;;
          esac
          {
            echo "tag=$tag"
            echo "desktop=$desktop"
            echo "android=$android"
            echo "android_ref=$android_ref"
          } >> "$GITHUB_OUTPUT"
          echo "Release ${tag:-(none)}: desktop=$desktop android=$android ($ANDROID_REPO@$android_ref)" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            # Packaged by FluentSetup below (SwitchTether-<version>-Setup.exe, replaces CC Switch).
            args: "--no-bundle"
          - name: macos-universal
            os: macos-15
            args: "--target universal-apple-darwin --bundles app,dmg"
          - name: linux-x64
            os: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
    steps:
      - uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Prepare updater signing key
        id: updater
        if: env.HAS_UPDATER_KEY == 'true'
        uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Secrets that are not set arrive as empty strings; Tauri treats a set-but-empty
          # APPLE_CERTIFICATE as a certificate to import and fails. Unset the empty ones so an
          # unsigned macOS build is produced instead.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          extra=""
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            extra='--config {"bundle":{"createUpdaterArtifacts":true}}'
          fi
          pnpm tauri build ${{ matrix.args }} $extra

      - name: Install FluentSetup
        if: runner.os == 'Windows'
        uses: TIANLI0/FluentSetup@v1.5.0

      - name: Package Windows installer (FluentSetup)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/package-windows.mjs --skip-build

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          if [ -d target-win/dist ]; then cp target-win/dist/*-Setup.exe dist-release/; fi
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.sig' -o -name '*.tar.gz' -o -name '*.zip' \) \
            ! -name 'control.tar.gz' ! -name 'data.tar.gz' \
            -exec cp {} dist-release/ \;
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist-release/*

  android:
    name: Android APK
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.ANDROID_REPO }}
          ref: ${{ needs.plan.outputs.android_ref }}
          path: android
          # third_party/coui17 is the COUI17 library (TIANLI0/COUI17) as a submodule.
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        working-directory: android
        env:
          ST_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          ST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Name and verify release APK
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          ver="$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)"
          if [ -n "$TAG" ] && [ "v$ver" != "$TAG" ]; then
            echo "::error::$ANDROID_REPO@$TAG has versionName $ver."
            exit 1
          fi
          mkdir -p dist-android
          signed=android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$signed" ]; then
            certs="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$signed")"
            echo "$certs" | grep -E "certificate (DN|SHA-256 digest)"
            # The release key's certificate; installed apps only accept updates signed by it.
            echo "$certs" | grep -q "certificate SHA-256 digest: 214a252bda32cb7e65e68a82f6322e509899e8f8aa08c07e12eb25dd84e90ab6"               || { echo "::error::APK is not signed with the SwitchTether release key"; exit 1; }
            cp "$signed" "dist-android/SwitchTether-$ver-android.apk"
          else
            echo "::warning::No signing secrets: the APK is UNSIGNED and cannot update an installed app."
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist-android/SwitchTether-$ver-android-unsigned.apk"
          fi
          ls -la dist-android

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android/*

  release:
    name: Draft GitHub release
    needs: [plan, desktop, android]
    # A platform the plan left out is "skipped", which would skip this job too: run whenever
    # nothing failed or was cancelled and at least one platform was built.
    if: >-
      always()
      && needs.plan.outputs.tag != ''
      && (github.event_name == 'push' || inputs.dry_run == false)
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.desktop.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir -p upload old
          find artifacts -type f -exec cp {} upload/ \;
          ls -la upload
          # Checksums for the in-app updaters (Android and FluentSetup verify against this file).
          (cd upload && sha256sum -- * > ../new-sums.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # This tag already has a release (e.g. the desktop was built by an earlier run): add
            # these assets and keep the other entries of its SHA256SUMS.txt.
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D old || true
            touch old/SHA256SUMS.txt
            awk 'NR == FNR { new[$2] = 1; next } !($2 in new)' new-sums.txt old/SHA256SUMS.txt > upload/SHA256SUMS.txt
            cat new-sums.txt >> upload/SHA256SUMS.txt
            cat upload/SHA256SUMS.txt
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber upload/*
          else
            cp new-sums.txt upload/SHA256SUMS.txt
            cat upload/SHA256SUMS.txt
            notes="SwitchTether $TAG (draft). Check signing status before publishing: unsigned artifacts are produced when signing secrets are absent."
            target=()
            # A dispatched run has no tag here yet; publishing creates it at this commit.
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then target=(--target "$GITHUB_SHA"); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft "${target[@]}" \
              --title "SwitchTether $TAG" --notes "$notes" upload/*
          fi
