# Example: run the SwitchTether relay with both transports.
#
# 1. Build, then create a relay key in relay/.env (git-ignored):
#      docker build -t switchtether-relay:local relay/
#      echo "SWITCHTETHER_RELAY_KEYS=$(docker run --rm switchtether-relay:local genkey)" > relay/.env
#    Several keys (rotation, one per user): comma-separated.
# 2. docker compose -f relay/docker-compose.yml up -d
# 3. Enter the same key in the desktop: Settings -> Remote -> Relay.
#
# Desktop relay URL:  tcp://<host>:47700   or   ws://<host>:8080/v1/tunnel
# For wss:// either put a TLS reverse proxy (Caddy, nginx, Traefik) in front of port 8080,
# or mount a certificate and set SWITCHTETHER_RELAY_TLS_CERT / _TLS_KEY (see below).
services:
  relay:
    build: .
    image: switchtether-relay:local
    restart: unless-stopped
    ports:
      - "47700:47700" # raw TCP transport
      - "8080:8080" # WebSocket /v1/tunnel and /healthz
    environment:
      # Required: the relay refuses to start without a key.
      SWITCHTETHER_RELAY_KEYS: ${SWITCHTETHER_RELAY_KEYS:?create relay/.env with SWITCHTETHER_RELAY_KEYS (see top of file)}
      # Alternative: a keys file (one key per line, # comments), re-read on
      # `docker compose kill -s HUP relay`. Use it instead of SWITCHTETHER_RELAY_KEYS above:
      # SWITCHTETHER_RELAY_KEYS_FILE: /run/secrets/relay_keys
      SWITCHTETHER_RELAY_LOG_LEVEL: info
      # Limits (docs/RELAY.md §4); these are the defaults.
      SWITCHTETHER_RELAY_MAX_DESKTOPS: "10000"
      SWITCHTETHER_RELAY_MAX_PENDING_PER_DESKTOP: "16"
      SWITCHTETHER_RELAY_MAX_TUNNELS_PER_DESKTOP: "32"
      SWITCHTETHER_RELAY_IDLE_TIMEOUT: 10m
      SWITCHTETHER_RELAY_BANDWIDTH: "0" # bytes/s per tunnel direction, 0 = unlimited
      # Serve wss:// directly (mount the files first):
      # SWITCHTETHER_RELAY_TLS_CERT: /certs/fullchain.pem
      # SWITCHTETHER_RELAY_TLS_KEY: /certs/privkey.pem
    # The files must be readable by the container user (uid 65532, distroless "nonroot").
    # volumes:
    #   - ./certs:/certs:ro
    # secrets: [relay_keys]   # for SWITCHTETHER_RELAY_KEYS_FILE; the file must be readable by uid 65532
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s # > SWITCHTETHER_RELAY_SHUTDOWN_GRACE (10s)
# secrets:
#   relay_keys:
#     file: ./relay-keys.txt
