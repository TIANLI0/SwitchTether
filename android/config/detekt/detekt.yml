# Light detekt config on top of detekt's defaults (buildUponDefaultConfig = true).
# Goal: catch likely bugs in new code without fighting the existing style. Size/complexity and
# style-preference rules that the codebase deliberately does not follow are switched off; the
# findings that remain in existing code are recorded in baseline.xml.

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  CyclomaticComplexMethod:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false
  LargeClass:
    active: false
  ComplexCondition:
    active: false

naming:
  FunctionNaming:
    # Composables are PascalCase.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false
  MatchingDeclarationName:
    active: false

style:
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  UnusedPrivateMember:
    # Compose @Preview functions are private and only used by tooling.
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
