# The SDK level the Robolectric tests run against.
sdk=35
# Keep Robolectric from inserting Conscrypt into the JVM-wide security provider list. It stays
# there after the sandbox is gone, and javax.crypto.JarVerifier then fails to initialise
# (Conscrypt cannot verify the JDK framework certificate), breaking every later plain-JVM test in
# the same fork that uses Cipher / okhttp-tls key stores. The tests need no Conscrypt-only crypto.
conscryptMode=OFF
