// Compose compiler stability configuration for :app (android/DEV_NOTES.md "Performance").
//
// :core:remote is a plain JVM module built without the Compose compiler, so Compose treats every
// class from it as unstable and (with strong skipping) compares those parameters by identity.
// The session list and the conversation rebuild these objects on every refresh / streamed event
// (AgentEventLog.renderItems() makes new RenderItems each time), so rows whose data did not change
// were recomposed anyway. The classes below are immutable: val-only data classes, enums and
// objects over immutable values (kotlinx JSON elements are read-only). Declaring them stable lets
// Compose compare them with equals() and skip unchanged rows.
io.github.tianli0.switchtether.remote.protocol.*
io.github.tianli0.switchtether.remote.session.RenderItem
kotlinx.serialization.json.JsonElement
kotlinx.serialization.json.JsonObject
kotlinx.serialization.json.JsonArray
kotlinx.serialization.json.JsonPrimitive
